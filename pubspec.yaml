name: Build Railway Mock Tests APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # यह कमांड अपने आप Android की सभी जरूरी फाइलें और 'Railway Mock Tests' नाम सेट कर देगी
      - name: Initialize Android Project
        run: |
          flutter create --platforms=android --org=com.railway.mocktests --project-name=railway_mock_tests .
          sed -i 's/android:label="railway_mock_tests"/android:label="Railway Mock Tests"/g' android/app/src/main/AndroidManifest.xml

      - name: Get Packages & Generate App Icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Railway_Mock_Tests_APK
          path: build/app/outputs/flutter-apk/app-release.apk
